<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Deliverance 0.0.15 - State of Diffusion</title>
  <desc id="desc">Release artwork for Deliverance 0.0.15, codename State of Diffusion, showing masked diffusion tokens resolving into text while KV cache keys persist into a namespaced disk vault.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="43%" r="72%">
      <stop offset="0" stop-color="#19324f"/>
      <stop offset="0.46" stop-color="#0b172a"/>
      <stop offset="1" stop-color="#040711"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff8ff"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.52" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.48"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0 H0 V38" fill="none" stroke="#a5b4fc" stroke-width="1" opacity="0.07"/>
    </pattern>
    <pattern id="noise" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.4" fill="#67e8f9" opacity="0.20"/>
      <circle cx="44" cy="33" r="1.1" fill="#fbbf24" opacity="0.16"/>
      <circle cx="62" cy="64" r="1.6" fill="#c4b5fd" opacity="0.18"/>
      <circle cx="28" cy="69" r="0.9" fill="#ffffff" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#noise)"/>
  <path d="M0 486 C118 446, 214 522, 350 478 C494 431, 591 484, 742 438 C895 391, 1020 454, 1200 400 L1200 630 L0 630 Z" fill="#020617" opacity="0.82"/>

  <g transform="translate(76 78)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#e0f2fe" letter-spacing="3">DELIVERANCE</text>
    <text x="0" y="64" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="88" font-weight="900" fill="#ffffff">0.0.15</text>
    <text x="4" y="125" font-family="Georgia, Times New Roman, serif" font-size="48" font-weight="800" fill="url(#cyan)">State of Diffusion</text>
    <rect x="6" y="151" width="430" height="3" rx="1.5" fill="url(#cyan)"/>
    <text x="6" y="193" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#cbd5e1">Nemotron diffusion, block denoising,</text>
    <text x="6" y="224" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#cbd5e1">shared KV blocks, disk persistence,</text>
    <text x="6" y="255" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#cbd5e1">TurboQuant cache state, native/GPU fixes.</text>
  </g>

  <g transform="translate(548 58)" filter="url(#shadow)">
    <rect x="0" y="0" width="560" height="472" rx="34" fill="#07111f" stroke="#334155" stroke-width="3"/>
    <rect x="28" y="34" width="504" height="120" rx="22" fill="#0f172a" stroke="#1e40af" stroke-width="2"/>
    <text x="52" y="77" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#93c5fd" letter-spacing="2">DIFFUSION WINDOW</text>
    <g transform="translate(52 98)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="800">
      <rect x="0" y="0" width="56" height="34" rx="8" fill="#172554" stroke="#38bdf8"/>
      <text x="28" y="25" text-anchor="middle" fill="#7dd3fc">M</text>
      <rect x="74" y="0" width="56" height="34" rx="8" fill="#172554" stroke="#38bdf8"/>
      <text x="102" y="25" text-anchor="middle" fill="#7dd3fc">A</text>
      <rect x="148" y="0" width="56" height="34" rx="8" fill="#2e1065" stroke="#c084fc" stroke-dasharray="6 4"/>
      <text x="176" y="25" text-anchor="middle" fill="#ddd6fe">?</text>
      <rect x="222" y="0" width="56" height="34" rx="8" fill="#2e1065" stroke="#c084fc" stroke-dasharray="6 4"/>
      <text x="250" y="25" text-anchor="middle" fill="#ddd6fe">?</text>
      <rect x="296" y="0" width="56" height="34" rx="8" fill="#052e16" stroke="#34d399"/>
      <text x="324" y="25" text-anchor="middle" fill="#bbf7d0">D</text>
      <rect x="370" y="0" width="56" height="34" rx="8" fill="#052e16" stroke="#34d399"/>
      <text x="398" y="25" text-anchor="middle" fill="#bbf7d0">E</text>
    </g>

    <g transform="translate(42 190)">
      <path d="M0 100 C88 28, 176 172, 264 88 C336 18, 414 66, 488 28" fill="none" stroke="url(#cyan)" stroke-width="5" opacity="0.78" stroke-linecap="round"/>
      <path d="M0 138 C120 91, 193 191, 294 126 C384 69, 432 137, 500 102" fill="none" stroke="url(#amber)" stroke-width="4" opacity="0.68" stroke-linecap="round"/>
      <path d="M26 44 C96 79, 106 11, 176 38 C235 61, 230 124, 302 112 C376 100, 382 32, 468 54" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.46" stroke-linecap="round"/>
      <g filter="url(#softGlow)">
        <circle cx="80" cy="70" r="12" fill="#38bdf8"/>
        <circle cx="175" cy="132" r="10" fill="#c084fc"/>
        <circle cx="285" cy="89" r="13" fill="#f59e0b"/>
        <circle cx="398" cy="68" r="10" fill="#22c55e"/>
      </g>
    </g>

    <g transform="translate(58 348)" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">
      <rect x="0" y="0" width="118" height="54" rx="15" fill="#111827" stroke="#38bdf8"/>
      <text x="59" y="34" text-anchor="middle" font-size="17" fill="#e0f2fe">KVCache2</text>
      <path d="M128 27 H218" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
      <circle cx="150" cy="27" r="8" fill="#fbbf24"/>
      <path d="M218 27 h32 v-12 h22 v12 h20 v12 h-20 v12 h-22 v-12 h-32z" fill="url(#amber)"/>
      <rect x="330" y="-10" width="144" height="74" rx="14" fill="#0f172a" stroke="#f59e0b"/>
      <rect x="350" y="8" width="104" height="14" rx="7" fill="#334155"/>
      <rect x="350" y="31" width="104" height="14" rx="7" fill="#334155"/>
      <text x="402" y="91" text-anchor="middle" font-size="15" fill="#fde68a">namespaced disk vault</text>
    </g>
  </g>

  <g transform="translate(82 402)" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">
    <rect x="0" y="0" width="128" height="54" rx="15" fill="#0f172a" stroke="#22c55e"/>
    <text x="64" y="34" text-anchor="middle" font-size="17" fill="#dcfce7">TurboQuant</text>
    <rect x="154" y="34" width="132" height="54" rx="15" fill="#0f172a" stroke="#38bdf8"/>
    <text x="220" y="68" text-anchor="middle" font-size="17" fill="#e0f2fe">Qwen KV</text>
    <rect x="312" y="-12" width="126" height="54" rx="15" fill="#0f172a" stroke="#c084fc"/>
    <text x="375" y="22" text-anchor="middle" font-size="17" fill="#ede9fe">Fuzzing</text>
    <rect x="464" y="30" width="132" height="54" rx="15" fill="#0f172a" stroke="#f59e0b"/>
    <text x="530" y="64" text-anchor="middle" font-size="17" fill="#fef3c7">Web Perf</text>
    <path d="M128 27 C147 27, 135 61, 154 61" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M286 61 C302 61, 294 15, 312 15" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M438 15 C457 15, 445 57, 464 57" fill="none" stroke="#64748b" stroke-width="2"/>
  </g>
</svg>
