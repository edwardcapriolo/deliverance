      <rect x="0" y="0" width="150" height="78" rx="13" fill="#111827" opacity="0.86"/>
      <text x="75" y="32" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#f7c948">JQ4</text>
      <text x="75" y="59" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">packed tensors</text>
    </g>

    <g transform="translate(142 215)">
      <rect x="0" y="0" width="118" height="86" rx="16" fill="#111827" opacity="0.86"/>
      <rect x="12" y="12" width="94" height="62" rx="10" fill="none" stroke="#f7c948" stroke-width="4" opacity="0.95"/>
      <text x="59" y="45" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900" fill="#f8fafc">JVM</text>
      <text x="59" y="65" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="1.3">LOCAL AI</text>
    </g>
  </g>

  <g transform="translate(116 455)">
    <rect x="0" y="0" width="968" height="86" rx="22" fill="#111827" opacity="0.82" stroke="#303848"/>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">
      <text x="38" y="36">GraniteMoeHybrid</text>
      <text x="278" y="36">Antares VLoc</text>
      <text x="477" y="36">uniform top-p</text>
      <text x="690" y="36">LoRA merge</text>
      <text x="838" y="36">Spring client</text>
    </g>
    <g fill="url(#amber)">
      <rect x="38" y="53" width="151" height="5" rx="2.5"/>
      <rect x="278" y="53" width="116" height="5" rx="2.5"/>
      <rect x="477" y="53" width="130" height="5" rx="2.5"/>
      <rect x="690" y="53" width="96" height="5" rx="2.5"/>
      <rect x="838" y="53" width="118" height="5" rx="2.5"/>
    </g>
