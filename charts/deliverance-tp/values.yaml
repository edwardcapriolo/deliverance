image:
  repository: edwardcapriolo/deliverance
  tag: latest
  pullPolicy: IfNotPresent

java:
  args:
    - -Djava.library.path=/deliverance/native-lib-only/linux-aarch_64
    - --add-modules
    - jdk.incubator.vector,jdk.httpserver,java.net.http
    - --add-opens
    - java.base/java.nio=ALL-UNNAMED
    - --enable-native-access=ALL-UNNAMED

nameOverride: ""
fullnameOverride: ""

model:
  owner: tjake
  name: gemma-2-2b-it-JQ4
  outputHeadQuantization: Q4

tensorParallel:
  cluster: deliverance-gemma2-tp
  deployment: gemma2-demo
  size: 4
  maxRanksPerWorker: 1
  collectiveTransport: http
  gossipPort: 42606
  readyTimeoutSeconds: 180
  rankEndpointTimeoutSeconds: 300

workers:
  replicas: 4
  poolSize: 16
  workingDType: F32
  workingQType: I8
  profileStages: true
  resources: {}
  # The image must be able to run this class with all Deliverance runtime dependencies on the classpath.
  command:
    - java
  baseArgs:
    - -cp
    - /deliverance/lib/*:/deliverance/web.jar
    - io.teknek.deliverance.benchmark.TpLocalCluster

coordinator:
  replicas: 1
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  command:
    - java
  args:
    - -jar
    - /deliverance/web.jar

benchmark:
  enabled: false
  prompt: "What is the capital of New York, USA? Answer with just the city."
  maxTokens: 24
  temperature: 0.0
  command:
    - java
  baseArgs:
    - -cp
    - /deliverance/lib/*:/deliverance/web.jar
    - io.teknek.deliverance.benchmark.TpLocalCluster

cache:
  enabled: true
  type: pvc # pvc, emptyDir, or hostPath
  mountPath: /home/deliverance/.deliverance
  storageClassName: ""
  size: 20Gi
  hostPath: /models/.deliverance

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
