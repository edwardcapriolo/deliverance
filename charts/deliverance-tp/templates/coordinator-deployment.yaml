apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deliverance-tp.coordinatorName" . }}
  labels:
    app.kubernetes.io/name: {{ include "deliverance-tp.name" . }}
    app.kubernetes.io/component: coordinator
spec:
  replicas: {{ .Values.coordinator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "deliverance-tp.name" . }}
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "deliverance-tp.name" . }}
        app.kubernetes.io/component: coordinator
    spec:
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
{{ toYaml .Values.coordinator.command | indent 12 }}
          args:
{{ toYaml .Values.coordinator.args | indent 12 }}
            - --spring.config.additional-location=file:/config/application.properties
          ports:
            - name: http
              containerPort: {{ .Values.coordinator.service.port }}
              protocol: TCP
            - name: gossip
              containerPort: {{ .Values.tensorParallel.gossipPort }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
{{- if .Values.cache.enabled }}
            - name: model-cache
              mountPath: {{ .Values.cache.mountPath }}
{{- end }}
          resources:
{{ toYaml .Values.coordinator.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "deliverance-tp.coordinatorName" . }}-config
{{- if .Values.cache.enabled }}
        - name: model-cache
          emptyDir: {}
{{- end }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
