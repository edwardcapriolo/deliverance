apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "deliverance-tp.workerName" . }}
  labels:
    app.kubernetes.io/name: {{ include "deliverance-tp.name" . }}
    app.kubernetes.io/component: worker
spec:
  serviceName: {{ include "deliverance-tp.workerName" . }}
  replicas: {{ .Values.workers.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "deliverance-tp.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "deliverance-tp.name" . }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
{{ toYaml .Values.workers.command | indent 12 }}
          args:
{{ toYaml .Values.java.args | indent 12 }}
{{ toYaml .Values.workers.baseArgs | indent 12 }}
            - --role
            - worker
            - --node-id
            - $(NODE_ID)
            - --uri
            - udp://$(POD_NAME).{{ include "deliverance-tp.workerName" . }}.$(POD_NAMESPACE).svc.cluster.local:{{ .Values.tensorParallel.gossipPort }}
{{ include "deliverance-tp.workerSeedArgs" . | indent 12 }}
{{ include "deliverance-tp.workerCommonArgs" . | indent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: gossip
              containerPort: {{ .Values.tensorParallel.gossipPort }}
              protocol: UDP
          volumeMounts:
{{- if .Values.cache.enabled }}
            - name: model-cache
              mountPath: {{ .Values.cache.mountPath }}
{{- end }}
          resources:
{{ toYaml .Values.workers.resources | indent 12 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
{{- if and .Values.cache.enabled (ne .Values.cache.type "pvc") }}
      volumes:
        - name: model-cache
{{- if eq .Values.cache.type "hostPath" }}
          hostPath:
            path: {{ .Values.cache.hostPath | quote }}
            type: DirectoryOrCreate
{{- else }}
          emptyDir: {}
{{- end }}
{{- end }}
{{- if and .Values.cache.enabled (eq .Values.cache.type "pvc") }}
  volumeClaimTemplates:
    - metadata:
        name: model-cache
      spec:
        accessModes: ["ReadWriteOnce"]
{{- if .Values.cache.storageClassName }}
        storageClassName: {{ .Values.cache.storageClassName | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.cache.size }}
{{- end }}
