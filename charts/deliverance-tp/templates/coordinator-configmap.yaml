apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deliverance-tp.coordinatorName" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "deliverance-tp.name" . }}
    app.kubernetes.io/component: coordinator
data:
  application.yaml: |
    server:
      port: {{ .Values.coordinator.service.port }}
    model:
      owner: {{ .Values.model.owner }}
      name: {{ .Values.model.name }}
      type: GENERATION
      config:
        outputHeadQuantization: {{ .Values.model.outputHeadQuantization }}
    tensorParallel:
      enabled: true
      cluster: {{ .Values.tensorParallel.cluster }}
      node-id: ${POD_IP}
      uri: udp://${POD_IP}:{{ .Values.tensorParallel.gossipPort }}
      deployment: {{ .Values.tensorParallel.deployment }}
      collective-transport: {{ .Values.tensorParallel.collectiveTransport }}
      assignment-mode: {{ .Values.tensorParallel.assignmentMode }}
      size: {{ .Values.tensorParallel.size }}
      max-ranks-per-worker: {{ .Values.tensorParallel.maxRanksPerWorker }}
      ready-timeout-seconds: {{ .Values.tensorParallel.readyTimeoutSeconds }}
      rank-endpoint-timeout-seconds: {{ .Values.tensorParallel.rankEndpointTimeoutSeconds }}
      rank-connect-timeout-seconds: {{ .Values.tensorParallel.rankConnectTimeoutSeconds }}
      rank-request-timeout-seconds: {{ .Values.tensorParallel.rankRequestTimeoutSeconds }}
      rank-operation-timeout-seconds: {{ .Values.tensorParallel.rankOperationTimeoutSeconds }}
      rank-close-timeout-seconds: {{ .Values.tensorParallel.rankCloseTimeoutSeconds }}
      output-head-quantization: {{ .Values.tensorParallel.outputHeadQuantization }}
    deliverance:
      kv:
        prefix:
          max-entries: 0
          max-tokens: 0
