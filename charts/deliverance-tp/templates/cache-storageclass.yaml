{{- if and .Values.cache.enabled .Values.cache.filestore.createStorageClass }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "deliverance-tp.cacheStorageClassName" . }}
provisioner: filestore.csi.storage.gke.io
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  tier: {{ .Values.cache.filestore.tier | quote }}
  network: {{ .Values.cache.filestore.network | quote }}
{{- end }}
