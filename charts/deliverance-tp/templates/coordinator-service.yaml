apiVersion: v1
kind: Service
metadata:
  name: {{ include "deliverance-tp.coordinatorName" . }}
  labels:
    app.kubernetes.io/name: {{ include "deliverance-tp.name" . }}
    app.kubernetes.io/component: coordinator
spec:
  type: {{ .Values.coordinator.service.type }}
{{- if .Values.coordinator.service.clusterIP }}
  clusterIP: {{ .Values.coordinator.service.clusterIP | quote }}
{{- end }}
  selector:
    app.kubernetes.io/name: {{ include "deliverance-tp.name" . }}
    app.kubernetes.io/component: coordinator
  ports:
    - name: http
      port: {{ .Values.coordinator.service.port }}
      targetPort: http
      protocol: TCP
    - name: gossip
      port: {{ .Values.tensorParallel.gossipPort }}
      targetPort: gossip
      protocol: UDP
