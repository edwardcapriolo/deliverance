# Overlay for running Qwen3 0.6B TP8 on GKE with 2 workers serving 4 ranks each.

nameOverride: model-testing
fullnameOverride: model-testing

tensorParallel:
  cluster: model-testing
  deployment: model-testing
  maxRanksPerWorker: 4
  readyTimeoutSeconds: 1800
  rankEndpointTimeoutSeconds: 1800
  rankConnectTimeoutSeconds: 5
  rankRequestTimeoutSeconds: 30
  rankOperationTimeoutSeconds: 60
  rankCloseTimeoutSeconds: 10

workers:
  replicas: 2

nodeSelector:
  kubernetes.io/arch: amd64

podSecurityContext:
  runAsUser: 101
  runAsGroup: 102
  fsGroup: 102
  fsGroupChangePolicy: OnRootMismatch

cache:
  # Shared Filestore CSI RWX cache mounted by coordinator and all workers.
  size: 1Ti
